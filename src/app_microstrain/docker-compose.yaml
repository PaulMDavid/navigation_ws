services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_microstrain
    tty: true
    stdin_open: true

    # Mount your project directories
    #NOTE: remove  or add volumes as needed, and adjust paths if necessary
    volumes:
      - .:/workspace/src/app_microstrain
      - ./data:/workspace/data
      - ./config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - ROS_DOMAIN_ID=0

    # Allows GUI tools (rviz, rqt, etc.)
    network_mode: host
    privileged: true

  
    working_dir: /workspace

    command: ros2 launch app_microstrain app_microstrain.launch.py