services:
   app_rtab_map:
    build:
      context: ./app_rtab_map
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_rtab_map_container
    tty: true
    stdin_open: true
    depends_on:
      app_zed2i_camera:
        condition: service_healthy
      app_lidar_ouster_ros:
        condition: service_healthy
    volumes:
      - ./app_rtab_map:/workspace
      - ./app_rtab_map/data:/workspace/data
      - ./app_rtab_map/config:/workspace/config
      - /mnt/check/rtabmap_database:/root/Documents/RTAB-Map
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
    network_mode: host
    privileged: true
    working_dir: /workspace
    command: >
      ros2 launch rtabmap_launch rtabmap.launch.py
      rgb_topic:=/zed2i/zed_node/rgb/color/rect/image
      camera_info_topic:=/zed2i/zed_node/rgb/color/rect/camera_info
      depth_topic:=/zed2i/zed_node/depth/depth_registered
      scan_cloud_topic:=/ouster/points
      imu_topic:=/ouster/imu
      subscribe_imu:=true
      subscribe_scan_cloud:=true
      frame_id:=chassis_link
      publish_tf:=true
      odom_frame_id:=odom
      visual_odometry:=true
      icp_odometry:=false
      approx_sync:=true
      approx_sync_max_interval:=0.1
      topic_queue_size:=10
      rtabmap_viz:=false
      database_path:=/root/Documents/RTAB-Map/rtabmap_vslam.db
      args:="--delete_db_on_start --Reg/Force3DoF false --Grid/Sensor 0 --Grid/RangeMax 20.0 --Grid/RangeMin 0.5 --RGBD/ProximityBySpace true --RGBD/AngularUpdate 0.05 --RGBD/LinearUpdate 0.05 --Optimizer/Strategy 1 --Optimizer/Iterations 20"
      params_file:=/workspace/config/params.yaml

