# u-blox ZED-F9P (ublox_dgnss::UbloxDGNSSNode), as app_gnss/launch/app_gnss.launch.py.
# The driver rejects keys it hasn't declared, so add one only after checking it works.
# CFG_RATE_MEAS 1000 / CFG_RATE_NAV 1 = 1 Hz position.
/**:
  ros__parameters:
    DEVICE_FAMILY: F9P
    DEVICE_SERIAL_STRING: ''  # set once a second F9P is connected
    FRAME_ID: gnss_link
    CFG_USBOUTPROT_NMEA: false
    CFG_RATE_MEAS: 1000
    CFG_RATE_NAV: 1
    CFG_MSGOUT_UBX_NAV_HPPOSLLH_USB: 1
    CFG_MSGOUT_UBX_NAV_STATUS_USB: 1
    CFG_MSGOUT_UBX_NAV_COV_USB: 1
    CFG_MSGOUT_UBX_RXM_RTCM_USB: 1
