# Static TF base_link (li_slam's lidar pose = os_sensor) -> chassis_link: the inverse
# of the URDF's chassis_link -> os0_lidar_link -> os_sensor (xyz 0.3098 -0.1666 0.104,
# no rotation). Update together with lidar_xyz in URDF/sensorsuite_front.xacro.
/**:
  ros__parameters:
    frame_id: base_link
    child_frame_id: chassis_link
    translation:
      x: -0.3098
      y: 0.1666
      z: -0.104
    rotation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0
