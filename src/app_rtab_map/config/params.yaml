/**:
  ros__parameters:
    # Frames
    frame_id: chassis_link
    odom_frame_id: odom
    map_frame_id: map

    # Sync
    approx_sync: true
    queue_size: 10

    # Subscriptions
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan_cloud: true

    # IMU
    imu_topic: /ouster/imu
    wait_imu_to_init: true

    # Database
    database_path: /root/Documents/RTAB-Map/rtabmap_lidar.db

    # Loop closure
    RGBD/ProximityBySpace: "true"
    RGBD/AngularUpdate: "0.05"
    RGBD/LinearUpdate: "0.05"

    # LiDAR grid map
    Grid/Sensor: "0"          # 0=lidar, was 1=camera depth
    Grid/RangeMax: "20.0"
    Grid/RangeMin: "0.5"

    # ICP odometry
    Icp/PointToPlane: "true"
    Icp/VoxelSize: "0.2"      # added - reduces pointcloud, faster processing
    Icp/PointToPlaneK: "5"
    Icp/MaxCorrespondenceDistance: "1.0"
    Icp/Iterations: "20"      # added - fewer iterations = faster

    # Registration
    Reg/Strategy: "1"         # 1=ICP only, was 2=VisIcp (needs camera)
    Reg/Force3DoF: "false"

    # Optimizer
    Optimizer/Strategy: "1"   # g2o
    Optimizer/Iterations: "20"