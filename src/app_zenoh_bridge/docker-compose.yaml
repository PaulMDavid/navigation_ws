# Zenoh router: carries a filtered slice of the robot's ROS graph to the ground station
# over Wi-Fi (eduroam), so DDS never crosses the wireless link. Allowlist in
# config/zenoh_bridge_robot.json5; the ground side is groundstation_navigation.
services:
  app_zenoh_bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_zenoh_bridge_container
    restart: unless-stopped
    # Host networking: the bridge must see the robot's DDS participants and expose
    # TCP 7447 for the ground station to connect on
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    volumes:
      # mounted so the allowlist can be edited without a rebuild
      - ./config/zenoh_bridge_robot.json5:/etc/zenoh/config.json5:ro
      - ../config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
