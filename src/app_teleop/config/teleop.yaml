# teleop_mux parameters. `source` comes from TELEOP_SOURCE (scripts/teleop_source.sh);
# set it live with:  ros2 param set /teleop_mux source phone
teleop_mux:
  ros__parameters:
    initial_mode: autonomous   # keeps today's behaviour: Nav2 drives after boot
    rate: 20.0                 # Hz, /cmd_vel is published at this rate in every mode
    teleop_timeout: 0.5        # s without an operator command -> zero (deadman)
    nav_timeout: 0.5           # s without a Nav2 command -> zero
    # Operator speed limits; no client can exceed them. Placeholders until checked
    # against morpheus_control's own limits on the rover.
    max_linear: 0.8            # m/s, hard cap on every operator input; 0.8 allows gear 4 (was 0.5); conservative placeholder, tune in field (#37)
    max_angular: 0.1           # rad/s, final clamp on every operator input; tuned 2026-11-07 on the rover (1.0 steered ~5x too hard in Ackermann mode).
                               # rover_arming overrides it per steering mode (1.0 Ackermann, 0.1 crab)
    nav_topic: /cmd_vel_auto   # Nav2's velocity smoother output
    out_topic: /cmd_vel        # morpheus_control on the rover subscribes here
    # Stick input /teleop/<source>/stick: gears, ramp, speed-dependent steering (README
    # "Gears and speed-dependent steering"). All conservative placeholders, tune in field (#37).
    gear_speeds: [0.15, 0.30, 0.50, 0.80]  # m/s at full throttle, gears 1..4 (0.54/1.08/1.8/2.88 km/h); conservative placeholder, tune in field (#37)
    accel: 0.3                 # m/s^2 while |v| grows; conservative placeholder, tune in field (#37)
    decel: 0.5                 # m/s^2 while |v| shrinks (stick released, downshift, reversing); conservative placeholder, tune in field (#37)
    a_lat_max: 0.5             # m/s^2 lateral acceleration limit, kappa_max = a_lat_max / v^2; conservative placeholder, tune in field (#37)
    min_turn_radius: 1.0       # m, full-lock curvature 1/min_turn_radius at low speed; conservative placeholder, tune in field (#37) (measure the real Ackermann lock)
    steer_rate: 2.0            # 1/s, steer moves at most this per second (centre -> full lock 0.5 s); conservative placeholder, tune in field (#37)
    odom_topic: /odom_wheels   # nav_msgs/Odometry, twist.twist.linear.x -> speed_meas in /teleop/state; conservative placeholder, tune in field (#37)
    odom_timeout: 0.5          # s; older odometry -> speed_meas null; conservative placeholder, tune in field (#37)

# teleop_camera: the phone app's camera page
teleop_camera:
  ros__parameters:
    # first one that exists is used: the ZED wrapper's two namings
    input_topics: [/zed2i/zed_node/rgb/color/rect/image/compressed,
                   /zed2i/zed_node/rgb/image_rect_color/compressed]
    max_rate: 10.0             # Hz to the phone
    max_width: 960             # px; wider frames are downscaled and re-encoded
    jpeg_quality: 60

# rover_arming: robot_control's mode switches (/joy presses) from the phone or ground PC,
# and its tracked state on /teleop/rover_state (README "Arming the rover")
rover_arming:
  ros__parameters:
    press_gap: 0.2             # s between Joy messages (press, all-zero, next press, ...)
    state_rate: 4.0            # Hz, /teleop/rover_state
    mux_state_timeout: 2.0     # s without /teleop/state -> active source unknown, commands refused
    mux_node: /teleop_mux      # its set_parameters service sets max_angular on steering change
    ackermann_max_angular: 1.0 # rad/s; 0.1 steers only ~7 deg in Ackermann
    crab_max_angular: 0.1      # rad/s; same as teleop_mux max_angular above
    joy_topic: /joy            # robot_control on the rover reads it

# nav_relay: the phone app's Autonav page (README "Autonav relay"): Nav2 goals and
# bringup from the phone, the map + Nav2 state to the phone
nav_relay:
  ros__parameters:
    map_topic: /rtabmap/map    # what Nav2's global costmap static layer reads (app_nav2 params.yaml)
    map_transient_local: true  # rtabmap publishes the map latched
    map_frame: map
    base_frame: chassis_link   # Nav2 robot_base_frame
    map_max_size: 1000         # cells per side sent to the phone; bigger maps are downsampled
    map_max_rate: 0.5          # Hz; the map is re-sent only when it changed, at most this often
    occupied_thresh: 65        # OccupancyGrid value >= this = occupied (map_saver default)
    free_thresh: 25            # 0..this = free; values between = unknown
    state_rate: 5.0            # Hz, /teleop/nav/state
    plan_topic: /plan          # planner_server's global plan
    plan_max_points: 200
    plan_max_age: 3.0          # s; an older plan is not shown (the planner replans at 1 Hz)
    action_name: /navigate_to_pose
    bringup_go_service: /bringup/go
    bringup_stop_service: /bringup/stop
    bringup_status_topic: /bringup/status
    mux_state_timeout: 2.0     # s without /teleop/state -> active source unknown, commands refused
