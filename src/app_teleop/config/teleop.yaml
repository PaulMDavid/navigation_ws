# teleop_mux parameters. `source` comes from TELEOP_SOURCE (scripts/teleop_source.sh);
# set it live with:  ros2 param set /teleop_mux source phone
teleop_mux:
  ros__parameters:
    initial_mode: autonomous   # keeps today's behaviour: Nav2 drives after boot
    rate: 20.0                 # Hz, /cmd_vel is published at this rate in every mode
    teleop_timeout: 0.5        # s without an operator command -> zero (deadman)
    nav_timeout: 0.5           # s without a Nav2 command -> zero
    # Operator speed limits; no client can exceed them. Placeholders until checked
    # against morpheus_control's own limits on the rover.
    max_linear: 0.5            # m/s
    max_angular: 0.1           # rad/s; tuned 2026-11-07 on the rover (1.0 steered ~5x too hard in Ackermann mode)
    nav_topic: /cmd_vel_auto   # Nav2's velocity smoother output
    out_topic: /cmd_vel        # morpheus_control on the rover subscribes here

# teleop_camera: the phone app's camera page
teleop_camera:
  ros__parameters:
    # first one that exists is used: the ZED wrapper's two namings
    input_topics: [/zed2i/zed_node/rgb/color/rect/image/compressed,
                   /zed2i/zed_node/rgb/image_rect_color/compressed]
    max_rate: 10.0             # Hz to the phone
    max_width: 960             # px; wider frames are downscaled and re-encoded
    jpeg_quality: 60

# rover_arming: robot_control's mode switches (/joy presses) from the phone or ground PC,
# and its tracked state on /teleop/rover_state (README "Arming the rover")
rover_arming:
  ros__parameters:
    press_gap: 0.2             # s between Joy messages (press, all-zero, next press, ...)
    state_rate: 4.0            # Hz, /teleop/rover_state
    mux_state_timeout: 2.0     # s without /teleop/state -> active source unknown, commands refused
    mux_node: /teleop_mux      # its set_parameters service sets max_angular on steering change
    ackermann_max_angular: 1.0 # rad/s; 0.1 steers only ~7 deg in Ackermann
    crab_max_angular: 0.1      # rad/s; same as teleop_mux max_angular above
    joy_topic: /joy            # robot_control on the rover reads it
