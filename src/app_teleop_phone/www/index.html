<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Rover Teleop</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --line: #2a2f3a; --text: #e8eaef; --dim: #8b93a5;
    --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; --accent: #3b82f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.3 system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    gap: 12px; user-select: none; touch-action: none; }
  .status { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .chip small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .chip b { font-size: 17px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--bad); }
  .warning { background: #3b2a0a; border: 1px solid var(--warn); color: #fde68a; border-radius: 10px;
    padding: 8px 10px; display: none; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .modes button { height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 15px; font-weight: 600; }
  .modes button.active { border-color: var(--accent); background: #1e3a8a; }
  .modes button.active[data-mode="stop"] { border-color: var(--bad); background: #7f1d1d; }
  .modes button.pending { border-style: dashed; }
  #pad { flex: 1; min-height: 200px; position: relative; border-radius: 18px; background: var(--panel);
    border: 1px solid var(--line); }
  #pad.disabled { opacity: .35; }
  #pad .ring { position: absolute; inset: 50% auto auto 50%; width: 70%; aspect-ratio: 1; max-height: 90%;
    transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed var(--line); }
  #knob { position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 4px 16px #0008; }
  #readout { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #stop { height: 84px; border: 4px solid #7f1d1d; border-radius: 42px; background: var(--bad); color: white;
    font-size: 26px; font-weight: 800; letter-spacing: .08em; }
  #stop:active { background: #991b1b; }
  #url { color: var(--dim); font-size: 12px; text-align: center; }
  #apk { color: var(--accent); font-size: 14px; text-align: center; }
</style>
</head>
<body>
  <div class="status">
    <div class="chip"><small>Link</small><b><span class="dot" id="linkDot"></span><span id="link">connecting…</span></b></div>
    <div class="chip"><small>Robot mode</small><b id="mode">—</b></div>
    <div class="chip"><small>Command source</small><b id="source">—</b></div>
    <div class="chip"><small>Robot hears phone</small><b id="age">—</b></div>
  </div>
  <div class="warning" id="warning"></div>
  <div class="modes">
    <button data-mode="autonomous">Autonomous</button>
    <button data-mode="manual">Manual</button>
    <button data-mode="stop">Stop</button>
  </div>
  <div id="pad"><div class="ring"></div><div id="knob"></div><div id="readout"></div></div>
  <button id="stop">STOP</button>
  <div id="url"></div>
  <a id="apk" href="rover-teleop.apk">Install the Android app (rover-teleop.apk)</a>
<script src="app.js"></script>
</body>
</html>
