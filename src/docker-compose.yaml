# app_nav_master (all nodes as components in one process) lives in its own fragment
include:
  - app_nav_master/docker-compose.yaml
  - app_zenoh_bridge/docker-compose.yaml

services:
  app_aruco_detector:
    build:
      context: ./app_aruco_detector
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: aruco_detector_ros_container
    tty: true
    stdin_open: true
    volumes:
      - ./app_aruco_detector:/workspace/src/aruco_detector
      - ./app_aruco_detector/data:/workspace/data
      - ./app_aruco_detector/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: ros2 launch aruco_detector aruco_detector.launch.py

  app_lidar_ouster_ros:
    build:
      context: ./app_lidar_ouster_ros
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_lidar_ouster_ros_container
    tty: true
    stdin_open: true
    volumes:
      - ./app_lidar_ouster_ros/ouster-ros:/workspace/src/ouster-ros
      - ./app_lidar_ouster_ros/ouster-sensor-msgs:/workspace/src/ouster-sensor-msgs
      - ./app_lidar_ouster_ros/LICENSE:/workspace/src/LICENSE
      - ./app_lidar_ouster_ros/data:/workspace/data
      - ./app_lidar_ouster_ros/config:/workspace/config
      # The entrypoint runs colcon build on every start; keeping build/install
      # makes every start after the first an incremental no-op instead of minutes.
      - ouster_build:/workspace/build
      - ouster_install:/workspace/install
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - OUSTER_SENSOR_HOSTNAME=169.254.61.114
      - OUSTER_LIDAR_MODE=1024x10
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash 2>/dev/null || true; ros2 topic list | grep -q '/ouster/points'"
      ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    command: ros2 launch ouster_ros driver.launch.py sensor_hostname:=169.254.61.114 lidar_mode:=1024x10 viz:=false

  app_robot_state_publisher:
    build:
      context: ./app_robot_state_publisher
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_robot_state_publisher_container
    tty: true
    stdin_open: true
    volumes:
      - ./app_robot_state_publisher:/workspace/src/robot_state_publisher
      - ./app_robot_state_publisher/data:/workspace/data
      - ./app_robot_state_publisher/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: ros2 run robot_state_publisher robot_state_publisher config/URDF/robot.urdf

  app_rtab_map:
    build:
      context: ./app_rtab_map
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_rtab_map_container
    tty: true
    stdin_open: true
    #depends_on:
    #  app_zed2i_camera:
    #    condition: service_healthy
    #  app_lidar_ouster_ros:
    #    condition: service_healthy
    volumes:
      - ./app_rtab_map:/workspace
      - ./app_rtab_map/data:/workspace/data
      - ./app_rtab_map/config:/workspace/config
      - /mnt/ssd/rtabmap_database:/root/Documents/RTAB-Map
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: >
      ros2 launch rtabmap_launch rtabmap.launch.py
      scan_cloud_topic:=/ouster/points
      imu_topic:=/ouster/imu
      subscribe_imu:=true
      subscribe_scan_cloud:=true
      depth:=false
      icp_odometry:=true
      visual_odometry:=false
      frame_id:=chassis_link
      qos:=2
      qos_imu:=2
      qos_scan:=2
      rtabmap_viz:=false
      database_path:=/root/Documents/RTAB-Map/rtabmap_lidar.db
      args:="--delete_db_on_start --Icp/VoxelSize 0.2 --Icp/Iterations 20 --Icp/PointToPlaneK 5 --Icp/PointToPlane true --Icp/MaxCorrespondenceDistance 1.0 --Reg/Strategy 1 --Reg/Force3DoF false --Grid/Sensor 0 --Grid/RangeMax 20.0 --Grid/RangeMin 0.65 --RGBD/ProximityBySpace true --RGBD/AngularUpdate 0.05 --RGBD/LinearUpdate 0.05 --Optimizer/Strategy 1 --Optimizer/Iterations 20"
    # To switch back to RGBD + lidar later, run:
    #   docker compose -f docker-compose.yaml -f docker-compose.rtabmap_camera.yaml up
    # Previous RGBD + lidar command:
    # command: >
    #   ros2 launch rtabmap_launch rtabmap.launch.py
    #   rgb_topic:=/zed2i/zed_node/rgb/color/rect/image
    #   camera_info_topic:=/zed2i/zed_node/rgb/color/rect/camera_info
    #   depth_topic:=/zed2i/zed_node/depth/depth_registered
    #   scan_cloud_topic:=/ouster/points
    #   #odom_topic:=/zed2i/zed_node/odom
    #   publish_tf:=true
    #   odom_frame_id:=odom
    #   frame_id:=chassis_link
    #   visual_odometry:=true
    #   icp_odometry:=false
    #   approx_sync:=true
    #   approx_sync_max_interval:=0.1
    #   topic_queue_size:=10
    #   rtabmap_viz:=false
    #   database_path:=/root/Documents/RTAB-Map/rtabmap_new.db
    #   args:="--delete_db_on_start"
    #   params_file:=/workspace/config/params.yaml
    #
    # Uncomment the override file above if you want the old RGBD+lidar mode.

  # qos:=2 above makes icp_odometry publish /rtabmap/odom best-effort, which Nav2's
  # reliable odometry subscriber can't receive; this republishes it reliably.
  app_odom_relay:
    build:
      context: ./app_rtab_map
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_odom_relay_container
    volumes:
      - ./app_rtab_map/odom_reliable_relay.py:/workspace/odom_reliable_relay.py:ro
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    command: python3 /workspace/odom_reliable_relay.py

  app_microstrain:
    build:
      context: ./app_microstrain
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_microstrain_container
    tty: true
    stdin_open: true
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - ./app_microstrain:/workspace/src/app_microstrain
      - ./app_microstrain/data:/workspace/data
      - ./app_microstrain/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: ros2 launch app_microstrain app_microstrain.launch.py

  app_zed2i_camera:
    build:
      context: ./app_zed2i_camera
      dockerfile: Dockerfile
    container_name: app_zed2i_camera
    runtime: nvidia
    privileged: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml

    devices:
      - /dev/video0:/dev/video0
      - /dev/bus/usb:/dev/bus/usb
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - ./rosbags:/workspace/rosbags
      - ./app_zed2i_camera/zed-ros2-wrapper:/workspace/src/zed-ros2-wrapper
      - ./app_zed2i_camera:/workspace/src/zed2i_camera
      - /mnt/ssd/zed2i_camcalib:/usr/local/zed/settings
      - /mnt/ssd/zed2i_resources:/usr/local/zed/resources 
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    healthcheck:
      test: ["CMD", "bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash 2>/dev/null || true; ros2 topic list | grep -q '/zed2i/zed_node/rgb/color/rect/image'"
      ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    command: ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zed2i camera_name:=zed2i publish_urdf:=false publish_tf:=false publish_map_tf:=false base_frame:=chassis_link
    #command: tail -f /dev/null

  app_rtab_zed2i:
      build:
        context: ./app_rtab_zed2i
        dockerfile: Dockerfile
      container_name: app_rtab_zed2i_container
      runtime: nvidia
      privileged: true
      tty: true
      stdin_open: true
  #    depends_on:
  #      app_lidar_ouster_ros:
  #        condition: service_healthy
      environment:
        - NVIDIA_VISIBLE_DEVICES=all
        - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
        - ROS_DISTRO=humble
        - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        - ROS_DOMAIN_ID=0
        - DEBIAN_FRONTEND=noninteractive
        - DISPLAY=${DISPLAY}
        - QT_X11_NO_MITSHM=1
        - XDG_RUNTIME_DIR=/tmp/runtime-root
      devices:
        - /dev/video0:/dev/video0
        - /dev/bus/usb:/dev/bus/usb
      network_mode: host
      ipc: host
      working_dir: /workspace
      volumes:
        - ./app_rtab_zed2i:/workspace/src/app_rtab_zed2i
        # ZED
        - ./app_zed2i_camera/zed-ros2-wrapper:/workspace/src/zed-ros2-wrapper
        - ./app_zed2i_camera:/workspace/src/zed2i_camera
        - /mnt/ssd/zed2i_camcalib:/usr/local/zed/settings
        - /mnt/ssd/zed2i_resources:/usr/local/zed/resources
        - ./rosbags:/workspace/rosbags
        # RTABmap
        - ./app_rtab_map:/workspace
        - ./app_rtab_map/data:/workspace/data
        - ./app_rtab_map/config:/workspace/config
        - /mnt/ssd/rtabmap_database:/root/Documents/RTAB-Map
        - /tmp/.X11-unix:/tmp/.X11-unix:rw
        - /home/pdavid/Desktop/uni/erc_clean/rtabmap_databases:/workspace/rtabmap_databases      
      #command: ros2 launch rtab_zed2i rtab_zed2i.launch.py
      command: tail -f /dev/null


  app_fast_calib:
    build:
      context: ./app_fast_calib
      dockerfile: Dockerfile
    container_name: fast_calib_ros_container
    tty: true
    stdin_open: true
    volumes:
      # ROS1 tool, standalone (no ROS 2 graph). FAST-Calib submodule mounted straight
      # into the catkin workspace so calib_data/ and output/ persist on the host.
      - ./app_fast_calib/FAST-Calib:/workspace/catkin_ws/src/fast_calib
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    privileged: true
    working_dir: /workspace/catkin_ws
    # No sensible default: needs calib_data/ populated first. See app_fast_calib/README.md.
    #   docker compose exec app_fast_calib bash
    #   roslaunch fast_calib calib.launch
    #   roslaunch fast_calib multi_calib.launch
    command: tail -f /dev/null

  app_fast_livo2:
    build:
      context: ./app_fast_livo2
      dockerfile: Dockerfile
    container_name: app_fast_livo2_container
    runtime: nvidia
    privileged: true
    tty: true
    stdin_open: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    devices:
      - /dev/video0:/dev/video0
      - /dev/bus/usb:/dev/bus/usb
    network_mode: host
    ipc: host
    working_dir: /workspace
    volumes:
      # This package: launch + config only, mounted straight over what the image copied in.
      - ./app_fast_livo2:/workspace/src/app_fast_livo2
      # FAST-LIVO2 + its vikit fork, both edited/tuned locally (extrinsics, camera
      # intrinsics) so they're mounted, not baked into the image.
      - ./app_fast_livo2/FAST-LIVO2:/workspace/src/FAST-LIVO2
      - ./app_fast_livo2/rpg_vikit_ros2_fisheye/vikit_common:/workspace/src/vikit_common
      - ./app_fast_livo2/rpg_vikit_ros2_fisheye/vikit_ros:/workspace/src/vikit_ros
      # ZED2i driver (source shared with app_zed2i_camera/app_rtab_zed2i)
      - ./app_zed2i_camera/zed-ros2-wrapper:/workspace/src/zed-ros2-wrapper
      - ./app_zed2i_camera:/workspace/src/zed2i_camera
      - /mnt/ssd/zed2i_camcalib:/usr/local/zed/settings
      - /mnt/ssd/zed2i_resources:/usr/local/zed/resources
      # Ouster driver (source shared with app_lidar_ouster_ros)
      - ./app_lidar_ouster_ros/ouster-ros:/workspace/src/ouster-ros
      - ./app_lidar_ouster_ros/ouster-sensor-msgs:/workspace/src/ouster-sensor-msgs
      - ./rosbags:/workspace/rosbags
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    # This service and app_zed2i_camera/app_lidar_ouster_ros/app_rtab_zed2i all drive the
    # same physical camera + LiDAR — don't run this alongside them. It supersedes those
    # three once the composable FAST-LIVO2 path is validated on hardware.
    # command: ros2 launch app_fast_livo2 fast_livo2.launch.py
    command: tail -f /dev/null

  app_nav2:
    build:
      context: ./app_nav2
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_nav2_container
    tty: true
    stdin_open: true
    volumes:
      - ./app_nav2:/workspace/src/app_nav2
      - ./app_nav2/data:/workspace/data
      - ./app_nav2/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    privileged: true
    working_dir: /workspace
    command: ros2 launch app_nav2 nav2.launch.py

  app_gnss:
    build:
      context: ./app_gnss
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_gnss_container
    tty: true
    stdin_open: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./app_gnss:/workspace/src/app_gnss
      - ./app_gnss/data:/workspace/data
      - ./app_gnss/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: ros2 launch app_gnss app_gnss.launch.py foxglove:=false

  # Staged Nav2 bringup driven from the ground station; see app_bringup_manager/README.md.
  # Start it once with:  docker compose -p navbringup up -d app_bringup_manager
  app_bringup_manager:
    build:
      context: ./app_bringup_manager
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_bringup_manager_container
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/navws:ro
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY:-}
      # stages.yaml = separate containers; stages_master.yaml = app_nav_master components
      - BRINGUP_STAGES=${BRINGUP_STAGES:-stages.yaml}
    network_mode: host
    ipc: host
    pid: host
    command: python3 /navws/app_bringup_manager/bringup_manager.py

  # Teleop: decides what reaches /cmd_vel (Nav2, an operator, or nothing); see
  # app_teleop/README.md. These run independently of the bringup; at boot,
  # scripts/teleop_source.sh starts the ones the command source needs:
  #   ground: app_teleop + app_zenoh_bridge          (orintwo on eduroam)
  #   phone:  + app_foxglove_bridge + app_teleop_phone (orintwo as Wi-Fi access point)
  app_teleop:
    build:
      context: ./app_teleop
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_teleop_container
    restart: unless-stopped
    volumes:
      - ./app_teleop:/workspace/app_teleop:ro
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      - PYTHONUNBUFFERED=1
      - TELEOP_SOURCE=${TELEOP_SOURCE:-ground}
      # the phone's topics live in their own domain, shared only with foxglove_bridge
      - TELEOP_PHONE_DOMAIN=${TELEOP_PHONE_DOMAIN:-51}
    network_mode: host
    ipc: host
    command: python3 app_teleop/teleop_mux.py --ros-args --params-file app_teleop/config/teleop.yaml

  # The phone app's link (Foxglove WebSocket, port 8765), in the phone domain only.
  app_foxglove_bridge:
    build:
      context: ./app_foxglove_bridge
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_foxglove_bridge_container
    restart: unless-stopped
    volumes:
      - ./app_foxglove_bridge/config:/config:ro
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${TELEOP_PHONE_DOMAIN:-51}
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    command: ros2 run foxglove_bridge foxglove_bridge --ros-args --params-file /config/foxglove_bridge.yaml

  # Serves the phone app (app_teleop_phone/www) on port 8080: http://10.42.0.1:8080
  app_teleop_phone:
    build:
      context: ./app_teleop
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_teleop_phone_container
    restart: unless-stopped
    volumes:
      - ./app_teleop_phone/www:/www:ro
    network_mode: host
    command: python3 -m http.server 8080 --directory /www

volumes:
  ouster_build:
  ouster_install:
