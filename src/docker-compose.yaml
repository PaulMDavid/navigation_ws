services:
  app_aruco_detector:
    build:
      context: ./app_aruco_detector
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: aruco_detector_ros_container
    tty: true
    stdin_open: true
    volumes:
      - ./app_aruco_detector:/workspace/src/aruco_detector
      - ./app_aruco_detector/data:/workspace/data
      - ./app_aruco_detector/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: ros2 launch aruco_detector aruco_detector.launch.py

  app_lidar_ouster_ros:
    build:
      context: ./app_lidar_ouster_ros
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_lidar_ouster_ros_container
    tty: true
    stdin_open: true
    volumes:
      - ./app_lidar_ouster_ros/ouster-ros:/workspace/src/ouster-ros
      - ./app_lidar_ouster_ros/ouster-sensor-msgs:/workspace/src/ouster-sensor-msgs
      - ./app_lidar_ouster_ros/LICENSE:/workspace/src/LICENSE
      - ./app_lidar_ouster_ros/data:/workspace/data
      - ./app_lidar_ouster_ros/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./app_lidar_ouster_ros/ouster-ros/config:/workspace/install/ouster_ros/share/ouster_ros/config
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - OUSTER_SENSOR_HOSTNAME=169.254.61.114
      - OUSTER_LIDAR_MODE=1024x10
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash 2>/dev/null || true; ros2 topic list | grep -q '/ouster/points'"
      ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    command: ros2 launch ouster_ros driver.launch.py sensor_hostname:=169.254.61.114 lidar_mode:=1024x10 viz:=false

  app_robot_state_publisher:
    build:
      context: ./app_robot_state_publisher
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_robot_state_publisher_container
    tty: true
    stdin_open: true
    volumes:
      - ./app_robot_state_publisher:/workspace/src/robot_state_publisher
      - ./app_robot_state_publisher/data:/workspace/data
      - ./app_robot_state_publisher/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: ros2 run robot_state_publisher robot_state_publisher config/URDF/robot.urdf

  app_rtab_map:
    build:
      context: ./app_rtab_map
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_rtab_map_container
    tty: true
    stdin_open: true
   # depends_on:
   #   app_zed2i_camera:
   #     condition: service_healthy
   #   app_lidar_ouster_ros:
   #     condition: service_healthy
    volumes:
      - ./app_rtab_map:/workspace
      - ./app_rtab_map/data:/workspace/data
      - ./app_rtab_map/config:/workspace/config
      - /mnt/ssd/rtabmap_database:/root/Documents/RTAB-Map
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: >
      ros2 launch rtabmap_launch rtabmap.launch.py
      scan_cloud_topic:=/ouster/points
      imu_topic:=/ouster/imu
      frame_id:=chassis_link
      odom_frame_id:=odom
      approx_sync:=true
      visual_odometry:=false
      icp_odometry:=true
      subscribe_scan_cloud:=true
      depth:=false
      qos:=2
      qos_imu:=2
      qos_scan:=2
      rtabmap_viz:=false
      database_path:=/root/Documents/RTAB-Map/rtabmap_lidar.db
      args:="--delete_db_on_start --Icp/VoxelSize 0.2 --Icp/Iterations 20 --Icp/PointToPlaneK 5 --Icp/PointToPlane true --Icp/MaxCorrespondenceDistance 1.0 --Reg/Strategy 1 --Reg/Force3DoF false --Grid/Sensor 0 --Grid/RangeMax 20.0 --Grid/RangeMin 0.5 --RGBD/ProximityBySpace true --RGBD/AngularUpdate 0.05 --RGBD/LinearUpdate 0.05 --Optimizer/Strategy 1 --Optimizer/Iterations 20"
    # To switch back to RGBD + lidar later, run:
    #   docker compose -f docker-compose.yaml -f docker-compose.rtabmap_camera.yaml up
    # Previous RGBD + lidar command:
    # command: >
    #   ros2 launch rtabmap_launch rtabmap.launch.py
    #   rgb_topic:=/zed2i/zed_node/rgb/color/rect/image
    #   camera_info_topic:=/zed2i/zed_node/rgb/color/rect/camera_info
    #   depth_topic:=/zed2i/zed_node/depth/depth_registered
    #   scan_cloud_topic:=/ouster/points
    #   #odom_topic:=/zed2i/zed_node/odom
    #   publish_tf:=true
    #   odom_frame_id:=odom
    #   frame_id:=chassis_link
    #   visual_odometry:=true
    #   icp_odometry:=false
    #   approx_sync:=true
    #   approx_sync_max_interval:=0.1
    #   topic_queue_size:=10
    #   rtabmap_viz:=false
    #   database_path:=/root/Documents/RTAB-Map/rtabmap_new.db
    #   args:="--delete_db_on_start"
    #   params_file:=/workspace/config/params.yaml
    #
    # Uncomment the override file above if you want the old RGBD+lidar mode.

  app_microstrain:
    build:
      context: ./app_microstrain
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_microstrain_container
    tty: true
    stdin_open: true
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - ./app_microstrain:/workspace/src/app_microstrain
      - ./app_microstrain/data:/workspace/data
      - ./app_microstrain/config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    command: ros2 launch app_microstrain app_microstrain.launch.py
  app_zed2i_camera:
    build:
      context: ./app_zed2i_camera
      dockerfile: Dockerfile
    container_name: app_zed2i_camera
    runtime: nvidia
    privileged: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml

    devices:
      - /dev/video0:/dev/video0
      - /dev/bus/usb:/dev/bus/usb
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - ./rosbags:/workspace/rosbags
      - ./app_zed2i_camera/zed-ros2-wrapper:/workspace/src/zed-ros2-wrapper
      - ./app_zed2i_camera:/workspace/src/zed2i_camera
      - /mnt/ssd/zed2i_camcalib:/usr/local/zed/settings
      - /mnt/ssd/zed2i_resources:/usr/local/zed/resources 
      - ./config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    healthcheck:
      test: ["CMD", "bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash 2>/dev/null || true; ros2 topic list | grep -q '/zed2i/zed_node/rgb/color/rect/image'"
      ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    command: ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zed2i camera_name:=zed2i publish_urdf:=false publish_tf:=false publish_map_tf:=false base_frame:=chassis_link
