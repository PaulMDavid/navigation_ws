services:
  app_fast_livo2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_fast_livo2_container
    runtime: nvidia
    privileged: true
    tty: true
    stdin_open: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    devices:
      - /dev/video0:/dev/video0
      - /dev/bus/usb:/dev/bus/usb
    network_mode: host
    ipc: host
    working_dir: /workspace
    volumes:
      # This package: launch + config only, mounted straight over what the image copied in.
      - .:/workspace/src/app_fast_livo2
      # FAST-LIVO2 + its vikit fork, both edited/tuned locally (extrinsics, camera
      # intrinsics) so they're mounted, not baked into the image.
      - ./FAST-LIVO2:/workspace/src/FAST-LIVO2
      - ./rpg_vikit_ros2_fisheye/vikit_common:/workspace/src/vikit_common
      - ./rpg_vikit_ros2_fisheye/vikit_ros:/workspace/src/vikit_ros
      # ZED2i driver (source shared with app_zed2i_camera/app_rtab_zed2i)
      - ../app_zed2i_camera/zed-ros2-wrapper:/workspace/src/zed-ros2-wrapper
      - ../app_zed2i_camera:/workspace/src/zed2i_camera
      - /mnt/ssd/zed2i_camcalib:/usr/local/zed/settings
      - /mnt/ssd/zed2i_resources:/usr/local/zed/resources
      # Ouster driver (source shared with app_lidar_ouster_ros)
      - ../app_lidar_ouster_ros/ouster-ros:/workspace/src/ouster-ros
      - ../app_lidar_ouster_ros/ouster-sensor-msgs:/workspace/src/ouster-sensor-msgs
      - ../rosbags:/workspace/rosbags
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../config/dds/cyclonedds.xml:/etc/cyclonedds.xml:ro
    # This service and app_zed2i_camera/app_lidar_ouster_ros/app_rtab_zed2i all drive the
    # same physical camera + LiDAR — don't run this alongside them.
    command: ros2 launch app_fast_livo2 fast_livo2.launch.py
