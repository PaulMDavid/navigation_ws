services:
  ouster-ros:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
        RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    image: ouster-ros:humble
    container_name: ouster-ros
    
    # Network access for LiDAR communication
    network_mode: host
    
    # Required for real-time performance
    privileged: true
    
    working_dir: /var/lib/build
    
    # Mount the entire project folder
    volumes:
      - .:/src/ouster-ros:rw
    
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOG_DIR=/tmp/ros_logs
      # Ouster sensor configuration
      - OUSTER_SENSOR_HOSTNAME=169.254.61.114
      - OUSTER_LIDAR_MODE=1024x10
    
    # Interactive terminal
    stdin_open: true
    tty: true
    
    # Override default entrypoint for development/testing
    # Uncomment to get a bash shell instead of auto-launching
    # entrypoint: ["/bin/bash"]
    
    # Default command launches the sensor node
    command: ["sensor_hostname:=169.254.61.114", "viz:=false"]
