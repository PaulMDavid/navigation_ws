# Large-message tuning for DDS over UDP, from the ROS 2 docs ("DDS tuning").
# One Ouster cloud is ~2.6 MB = ~1800 IP fragments; the default 208 KB receive
# buffer drops fragments under load, and reliable topics then stall on retransmits.
net.core.rmem_max=2147483647
# Drop incomplete fragmented datagrams after 3 s instead of 30 s, and allow more
# reassembly memory, so half-received clouds don't pile up.
net.ipv4.ipfrag_time=3
net.ipv4.ipfrag_high_thresh=134217728
